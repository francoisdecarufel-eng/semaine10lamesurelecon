<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Découverte de la mesure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4; /* Vert très clair */
            touch-action: pan-y; /* Empêche le zoom tactile indésirable */
        }
        .tab-button-active {
            background-color: #3b82f6;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .tab-button-inactive {
            background-color: #e5e7eb;
            color: #4b5563;
        }
        .bounce-animation {
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(-5%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        /* Pour le canvas du TNI */
        canvas {
            touch-action: none; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPOSANT: ONGLET 1 - DÉCOUVERTE DE LA RÈGLE ---
        const TabRuler = () => {
            const [pencilLength, setPencilLength] = useState(0);
            const [userAnswer, setUserAnswer] = useState("");
            const [feedback, setFeedback] = useState(null);
            const [attempt, setAttempt] = useState(0);

            // Progression de difficulté : 3 entiers, 3 demis, 5+ précis
            const difficultyProgression = [
                5, 8, 12,       // Facile : entiers
                4.5, 9.5, 11.5, // Moyen : demis
                6.2, 3.8, 13.4, 7.7, 10.1 // Difficile : millimètres précis
            ];

            const generateNewPencil = () => {
                let length;
                if (attempt < difficultyProgression.length) {
                    length = difficultyProgression[attempt];
                } else {
                    // Après les 11 premiers, on génère aléatoirement
                    const whole = Math.floor(Math.random() * 10) + 3;
                    const decimal = Math.floor(Math.random() * 10); // 0 à 9
                    length = whole + (decimal / 10);
                }
                setPencilLength(length);
                setUserAnswer("");
                setFeedback(null);
                setAttempt(attempt + 1);
            };

            useEffect(() => {
                generateNewPencil();
            }, []);

            const checkAnswer = () => {
                // Remplacer la virgule par un point pour la validation
                const parsedAnswer = parseFloat(userAnswer.toString().replace(',', '.'));
                if (parsedAnswer === pencilLength) {
                    setFeedback({ type: 'success', text: "Bravo ! Tu as bien mesuré le crayon ! ✅" });
                } else {
                    if (pencilLength % 1 !== 0) {
                        setFeedback({ type: 'error', text: "Oups ! Ce n'est pas un nombre exact. Regarde bien les petites lignes (millimètres) et utilise une virgule ou un point (ex: 4.5). ❌" });
                    } else {
                        setFeedback({ type: 'error', text: "Oups ! Regarde bien où se termine la pointe du crayon. ❌" });
                    }
                }
            };

            return (
                <div className="flex flex-col items-center w-full space-y-8 animate-fade-in">
                    <div className="bg-white p-6 rounded-2xl shadow-lg w-full max-w-4xl text-center border-4 border-blue-200">
                        <h2 className="text-3xl font-bold text-blue-600 mb-4">Comment utiliser une règle ? 📏</h2>
                        <p className="text-xl text-gray-700">
                            1. Place le <strong>zéro (0)</strong> de la règle au début de l'objet.<br/>
                            2. Regarde le nombre qui s'aligne avec la <strong>fin de l'objet</strong>.<br/>
                            3. Ce nombre est la longueur en <strong>centimètres (cm)</strong> !
                        </p>
                    </div>

                    <div className="bg-yellow-50 p-8 rounded-2xl shadow-lg w-full max-w-4xl flex flex-col items-center border-4 border-yellow-300">
                        <h3 className="text-2xl font-bold text-yellow-600 mb-8">À toi de jouer ! Quelle est la longueur de ce crayon ?</h3>
                        
                        {/* Zone de mesure visuelle avec haute précision */}
                        <div className="relative w-full max-w-3xl mx-auto mt-6 mb-16">
                            
                            {/* Ligne guide rouge (indicateur de précision clair) */}
                            <div className="absolute top-[-5px] h-[95px] w-0 border-l-[4px] border-dashed border-red-500 z-0 transition-all duration-500 ease-in-out" 
                                 style={{ left: `${(pencilLength / 15) * 100}%`, transform: 'translateX(-50%)' }}>
                            </div>

                            {/* Le crayon dynamique */}
                            <div className="relative z-10 flex items-center mb-1 h-16 drop-shadow-md" style={{ width: `${(pencilLength / 15) * 100}%`, transition: 'width 0.5s ease-in-out' }}>
                                <div className="bg-yellow-400 h-full flex-grow rounded-l-md border-y-[3px] border-l-[3px] border-yellow-600 flex items-center px-4">
                                    <span className="text-yellow-700 font-bold text-xl">HB 2</span>
                                </div>
                                {/* Pointe du crayon SVG ultra précise */}
                                <div className="w-[60px] h-full flex-shrink-0 relative overflow-hidden">
                                    <svg viewBox="0 0 60 64" preserveAspectRatio="none" className="w-full h-full drop-shadow-sm">
                                        <polygon points="0,0 60,32 0,64" fill="#FDE68A" />
                                        <polygon points="40,21.33 60,32 40,42.66" fill="#374151" />
                                        {/* Bordures du crayon en SVG */}
                                        <line x1="0" y1="1.5" x2="60" y2="32" stroke="#ca8a04" strokeWidth="3" />
                                        <line x1="0" y1="62.5" x2="60" y2="32" stroke="#ca8a04" strokeWidth="3" />
                                    </svg>
                                </div>
                            </div>

                            {/* La règle de précision (15 cm) */}
                            <div className="w-full h-24 bg-blue-50 relative flex shadow-lg border-y-[3px] border-black mt-2">
                                {/* La ligne du 0 */}
                                <div className="absolute left-0 top-0 bottom-0 border-l-[3px] border-black z-10"></div>
                                
                                {[...Array(15)].map((_, cmIndex) => (
                                    <div key={cmIndex} className="flex-1 relative h-full flex items-start border-r-[3px] border-black box-border">
                                        
                                        {/* Numéro du cm centré sur le bord GAUCHE de ce bloc (ligne de cmIndex) */}
                                        <span className="absolute bottom-1 left-0 transform -translate-x-1/2 font-bold text-2xl text-black bg-blue-50 px-1 rounded-full z-10">
                                            {cmIndex}
                                        </span>
                                        
                                        {/* Les 9 petites lignes (millimètres) */}
                                        <div className="w-full h-full flex">
                                            {[...Array(10)].map((_, mmIndex) => (
                                                <div key={mmIndex} className="flex-1 border-black box-border" style={{ 
                                                    height: mmIndex === 9 ? '0' : (mmIndex === 4 ? '35px' : '15px'),
                                                    borderRightWidth: mmIndex === 9 ? '0' : '2px'
                                                }}></div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                                {/* Numéro 15 sur le bord DROIT du dernier bloc */}
                                <span className="absolute bottom-1 right-0 transform translate-x-1/2 font-bold text-2xl text-black bg-blue-50 px-1 rounded-full z-10">
                                    15
                                </span>
                            </div>
                        </div>

                        {/* Zone de réponse */}
                        <div className="flex items-center space-x-4">
                            <input 
                                type="number"
                                step="0.1"
                                className="w-32 h-16 text-3xl text-center rounded-xl border-4 border-gray-300 focus:border-blue-500 focus:outline-none"
                                value={userAnswer}
                                onChange={(e) => setUserAnswer(e.target.value)}
                                placeholder="ex: 3.5"
                            />
                            <span className="text-3xl font-bold text-gray-700">cm</span>
                            <button 
                                onClick={checkAnswer}
                                className="ml-4 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transform transition hover:scale-105 text-xl"
                            >
                                Vérifier
                            </button>
                        </div>

                        {/* Feedback */}
                        {feedback && (
                            <div className={`mt-6 p-4 rounded-xl text-2xl font-bold w-full text-center ${feedback.type === 'success' ? 'bg-green-100 text-green-700 border-2 border-green-400' : 'bg-red-100 text-red-700 border-2 border-red-400'}`}>
                                {feedback.text}
                            </div>
                        )}

                        <button 
                            onClick={generateNewPencil}
                            className="mt-8 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg shadow transition text-lg"
                        >
                            🔄 Recommencer avec un nouveau crayon
                        </button>
                    </div>
                </div>
            );
        };

        // --- COMPOSANT: ONGLET 2 - SYSTÈME MÉTRIQUE ---
        const TabMetric = () => {
            const questions = [
                { obj: "Une fourmi 🐜", correct: "mm", options: ["mm", "cm", "m", "km"], hint: "C'est tout petit !" },
                { obj: "Un autobus 🚌", correct: "m", options: ["mm", "cm", "m", "km"], hint: "C'est grand, on peut marcher dedans." },
                { obj: "La distance entre Montréal et Québec 🚗", correct: "km", options: ["mm", "cm", "m", "km"], hint: "C'est très très long, ça prend des heures en voiture." },
                { obj: "Une gomme à effacer ✏️", correct: "cm", options: ["mm", "cm", "m", "km"], hint: "Ça rentre dans ta main." },
                { obj: "La cour d'école 🏫", correct: "m", options: ["mm", "cm", "m", "km"], hint: "Tu peux courir dedans." }
            ];

            const [currentQ, setCurrentQ] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [score, setScore] = useState(0);

            const handleAnswer = (answer) => {
                if (answer === questions[currentQ].correct) {
                    setFeedback({ type: 'success', text: "Excellente réponse ! ✅" });
                    setScore(score + 1);
                    setTimeout(() => {
                        if (currentQ < questions.length - 1) {
                            setCurrentQ(currentQ + 1);
                            setFeedback(null);
                        } else {
                            setFeedback({ type: 'finish', text: `Jeu terminé ! Ton score : ${score + 1} / ${questions.length} 🏆` });
                        }
                    }, 1500);
                } else {
                    setFeedback({ type: 'error', text: `❌ Essaie encore. Indice : ${questions[currentQ].hint}` });
                }
            };

            const resetGame = () => {
                setCurrentQ(0);
                setScore(0);
                setFeedback(null);
            };

            return (
                <div className="flex flex-col items-center w-full space-y-8 animate-fade-in">
                    <div className="bg-white p-6 rounded-2xl shadow-lg w-full max-w-4xl text-center border-4 border-purple-200 flex justify-around">
                        <div className="flex flex-col items-center p-2"><span className="text-4xl">🐜</span><span className="font-bold text-xl mt-2 text-purple-600">Millimètre (mm)</span><span className="text-gray-500">Très petit</span></div>
                        <div className="flex flex-col items-center p-2"><span className="text-4xl">✏️</span><span className="font-bold text-xl mt-2 text-purple-600">Centimètre (cm)</span><span className="text-gray-500">Petit objet</span></div>
                        <div className="flex flex-col items-center p-2"><span className="text-4xl">🚌</span><span className="font-bold text-xl mt-2 text-purple-600">Mètre (m)</span><span className="text-gray-500">Grand objet</span></div>
                        <div className="flex flex-col items-center p-2"><span className="text-4xl">🌎</span><span className="font-bold text-xl mt-2 text-purple-600">Kilomètre (km)</span><span className="text-gray-500">Distance</span></div>
                    </div>

                    <div className="bg-purple-50 p-8 rounded-2xl shadow-lg w-full max-w-4xl flex flex-col items-center border-4 border-purple-300">
                        <h3 className="text-3xl font-bold text-purple-800 mb-6 text-center">Choisis la bonne unité de mesure !</h3>
                        
                        {feedback?.type !== 'finish' ? (
                            <>
                                <div className="text-4xl mb-8 font-extrabold text-gray-800 bg-white py-4 px-8 rounded-full shadow-md">
                                    {questions[currentQ].obj}
                                </div>

                                <div className="grid grid-cols-2 gap-6 w-full max-w-lg mb-8">
                                    {questions[currentQ].options.map(opt => (
                                        <button 
                                            key={opt}
                                            onClick={() => handleAnswer(opt)}
                                            className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-6 px-4 rounded-2xl shadow-lg transform transition hover:scale-105 text-3xl"
                                        >
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            </>
                        ) : null}

                        {feedback && (
                            <div className={`mt-4 p-6 rounded-xl text-2xl font-bold w-full text-center ${
                                feedback.type === 'success' ? 'bg-green-100 text-green-700 border-2 border-green-400' : 
                                feedback.type === 'error' ? 'bg-red-100 text-red-700 border-2 border-red-400' :
                                'bg-yellow-100 text-yellow-700 border-4 border-yellow-500 text-4xl py-10'
                            }`}>
                                {feedback.text}
                            </div>
                        )}

                        <div className="mt-8 flex justify-between w-full max-w-lg items-center">
                            <span className="text-xl font-bold text-purple-500">Question {currentQ + 1} / {questions.length}</span>
                            <button 
                                onClick={resetGame}
                                className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded-lg shadow transition text-lg"
                            >
                                🔄 Recommencer
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPOSANT: ONGLET NOUVEAU - TABLEAU MÉTRIQUE ---
        const TabTableau = () => {
            const columns = [
                { id: 'km', label: 'km', name: 'kilomètre' },
                { id: 'hm', label: 'hm', name: 'hectomètre' },
                { id: 'dam', label: 'dam', name: 'décamètre' },
                { id: 'm', label: 'm', name: 'mètre' },
                { id: 'dm', label: 'dm', name: 'décimètre' },
                { id: 'cm', label: 'cm', name: 'centimètre' },
                { id: 'mm', label: 'mm', name: 'millimètre' }
            ];
            
            const examples = [
                { 
                    text: "34 cm", 
                    baseAns: { cm: '4', dm: '3' }, 
                    conversions: [
                        { unit: 'mm', name: 'millimètres', ans: { dm: '3', cm: '4', mm: '0' } },
                        { unit: 'm', name: 'mètres', ans: { m: '0,', dm: '3', cm: '4' } }
                    ] 
                },
                { 
                    text: "125 m", 
                    baseAns: { m: '5', dam: '2', hm: '1' }, 
                    conversions: [
                        { unit: 'km', name: 'kilomètres', ans: { km: '0,', hm: '1', dam: '2', m: '5' } },
                        { unit: 'cm', name: 'centimètres', ans: { hm: '1', dam: '2', m: '5', dm: '0', cm: '0' } }
                    ] 
                },
                { 
                    text: "7 km", 
                    baseAns: { km: '7' }, 
                    conversions: [
                        { unit: 'm', name: 'mètres', ans: { km: '7', hm: '0', dam: '0', m: '0' } }
                    ] 
                },
                { 
                    text: "48 mm", 
                    baseAns: { mm: '8', cm: '4' }, 
                    conversions: [
                        { unit: 'dm', name: 'décimètres', ans: { dm: '0,', cm: '4', mm: '8' } },
                        { unit: 'cm', name: 'centimètres', ans: { cm: '4,', mm: '8' } }
                    ] 
                },
                { 
                    text: "96 dm", 
                    baseAns: { dm: '6', m: '9' }, 
                    conversions: [
                        { unit: 'mm', name: 'millimètres', ans: { m: '9', dm: '6', cm: '0', mm: '0' } },
                        { unit: 'dam', name: 'décamètres', ans: { dam: '0,', m: '9', dm: '6' } }
                    ] 
                }
            ];

            const [currentEx, setCurrentEx] = useState(0);
            const [inputs, setInputs] = useState({km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''});
            const [feedback, setFeedback] = useState(null);
            const [step, setStep] = useState(1); 
            const [activeConversion, setActiveConversion] = useState(null);
            
            // État pour le simulateur pas à pas
            const [currentSim, setCurrentSim] = useState(0);
            const [simStep, setSimStep] = useState(0);
            
            // 15 Exemples de simulation
            const allSimulations = [
                // Ex 1: 34 cm -> m
                [
                    { text: "🎯 Mission 1 : Convertir 34 cm en mètres (m)", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''} },
                    { text: "1️⃣ Unité (cm) : On place le chiffre des unités (4).", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:<span className="text-red-600 font-black animate-pulse">4</span>, mm:''} },
                    { text: "2️⃣ On place l'autre chiffre à gauche (3 dans dm).", cols: {km:'', hm:'', dam:'', m:'', dm:<span className="text-blue-600 font-black animate-pulse">3</span>, cm:'4', mm:''} },
                    { text: "3️⃣ On veut des mètres (m) ! La colonne est vide, on ajoute un 0.", cols: {km:'', hm:'', dam:'', m:<span className="text-green-600 font-black animate-pulse">0</span>, dm:'3', cm:'4', mm:''} },
                    { text: "4️⃣ Pour lire en mètres (m), on ajoute la virgule dans cette colonne.", cols: {km:'', hm:'', dam:'', m:<span className="text-purple-600 font-black scale-125 inline-block">0,</span>, dm:'3', cm:'4', mm:''} },
                    { text: "✨ Réponse : 34 cm = 0,34 m", cols: {km:'', hm:'', dam:'', m:'0,', dm:'3', cm:'4', mm:''} }
                ],
                // Ex 2: 7 m -> cm
                [
                    { text: "🎯 Mission 2 : Convertir 7 m en centimètres (cm)", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''} },
                    { text: "1️⃣ Unité (m) : On place le chiffre (7).", cols: {km:'', hm:'', dam:'', m:<span className="text-red-600 font-black animate-pulse">7</span>, dm:'', cm:'', mm:''} },
                    { text: "2️⃣ On veut des centimètres (cm) ! On avance vers la droite en ajoutant un 0 dans (dm).", cols: {km:'', hm:'', dam:'', m:'7', dm:<span className="text-green-600 font-black animate-pulse">0</span>, cm:'', mm:''} },
                    { text: "3️⃣ On ajoute un autre 0 pour atteindre la colonne d'arrivée (cm).", cols: {km:'', hm:'', dam:'', m:'7', dm:'0', cm:<span className="text-green-600 font-black animate-pulse">0</span>, mm:''} },
                    { text: "✨ Réponse : 7 m = 700 cm", cols: {km:'', hm:'', dam:'', m:'7', dm:'0', cm:'0', mm:''} }
                ],
                // Ex 3: 15 dm -> mm
                [
                    { text: "🎯 Mission 3 : Convertir 15 dm en millimètres (mm)", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''} },
                    { text: "1️⃣ Unité (dm) : On place le chiffre des unités (5).", cols: {km:'', hm:'', dam:'', m:'', dm:<span className="text-red-600 font-black animate-pulse">5</span>, cm:'', mm:''} },
                    { text: "2️⃣ On place le (1) à sa gauche, dans les mètres (m).", cols: {km:'', hm:'', dam:'', m:<span className="text-blue-600 font-black animate-pulse">1</span>, dm:'5', cm:'', mm:''} },
                    { text: "3️⃣ On veut des millimètres (mm) ! On ajoute des zéros jusqu'à la colonne (mm).", cols: {km:'', hm:'', dam:'', m:'1', dm:'5', cm:<span className="text-green-600 font-black">0</span>, mm:<span className="text-green-600 font-black animate-pulse">0</span>} },
                    { text: "✨ Réponse : 15 dm = 1500 mm", cols: {km:'', hm:'', dam:'', m:'1', dm:'5', cm:'0', mm:'0'} }
                ],
                // Ex 4: 8 mm -> cm
                [
                    { text: "🎯 Mission 4 : Convertir 8 mm en centimètres (cm)", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''} },
                    { text: "1️⃣ Unité (mm) : On place le chiffre (8).", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:<span className="text-red-600 font-black animate-pulse">8</span>} },
                    { text: "2️⃣ On veut des centimètres (cm) ! On recule à cette colonne et on y met un 0.", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:<span className="text-green-600 font-black animate-pulse">0</span>, mm:'8'} },
                    { text: "3️⃣ On place la virgule dans cette colonne d'arrivée (cm).", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:<span className="text-purple-600 font-black scale-125 inline-block">0,</span>, mm:'8'} },
                    { text: "✨ Réponse : 8 mm = 0,8 cm", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:'0,', mm:'8'} }
                ],
                // Ex 5: 250 m -> km
                [
                    { text: "🎯 Mission 5 : Convertir 250 m en kilomètres (km)", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''} },
                    { text: "1️⃣ Unité (m) : Chiffre des unités (0).", cols: {km:'', hm:'', dam:'', m:<span className="text-red-600 font-black animate-pulse">0</span>, dm:'', cm:'', mm:''} },
                    { text: "2️⃣ On place le 5 et le 2 à gauche.", cols: {km:'', hm:<span className="text-blue-600 font-black">2</span>, dam:<span className="text-blue-600 font-black">5</span>, m:'0', dm:'', cm:'', mm:''} },
                    { text: "3️⃣ On veut des kilomètres (km) ! On ajoute 0 et une virgule dans cette colonne.", cols: {km:<span className="text-purple-600 font-black animate-pulse scale-125 inline-block">0,</span>, hm:'2', dam:'5', m:'0', dm:'', cm:'', mm:''} },
                    { text: "✨ Réponse : 250 m = 0,250 km (ou 0,25 km)", cols: {km:'0,', hm:'2', dam:'5', m:'0', dm:'', cm:'', mm:''} }
                ],
                // Ex 6: 9 dam -> m
                [
                    { text: "🎯 Mission 6 : Convertir 9 dam en mètres (m)", cols: {km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''} },
                    { text: "1️⃣ Unité (dam) : On place le chiffre (9).", cols: {km:'', hm:'', dam:<span className="text-red-600 font-black animate-pulse">9</span>, m:'', dm:'', cm:'', mm:''} },
                    { text: "2️⃣ On veut des mètres (m) ! On complète avec un 0 dans cette colonne.", cols: {km:'', hm:'', dam:'9', m:<span className="text-green-600 font-black animate-pulse">0</span>, dm:'', cm:'', mm:''} },

        const TabPractice = () => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [ctx, setCtx] = useState(null);
            
            // États pour le convertisseur assisté pas à pas
            const [practiceMode, setPracticeMode] = useState('setup'); // 'setup', 'place', 'convert', 'done'
            const [baseVal, setBaseVal] = useState('34');
            const [baseUnit, setBaseUnit] = useState('mm');
            const [targetUnit, setTargetUnit] = useState('cm');
            const [practiceInputs, setPracticeInputs] = useState({km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''});
            const [practiceFeedback, setPracticeFeedback] = useState(null);
            
            const cols = ['km', 'hm', 'dam', 'm', 'dm', 'cm', 'mm'];
            
            // État pour la règle libre
            const [sandboxLength, setSandboxLength] = useState(7.5);

            useEffect(() => {
                const canvas = canvasRef.current;
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                
                const context = canvas.getContext("2d");
                context.lineCap = "round";
                context.strokeStyle = "#1e3a8a";
                context.lineWidth = 5;
                setCtx(context);

                const handleResize = () => {
                    const temp = context.getImageData(0,0,canvas.width, canvas.height);
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                    context.lineCap = "round";
                    context.strokeStyle = "#1e3a8a";
                    context.lineWidth = 5;
                    context.putImageData(temp, 0,0);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const startDrawing = (e) => {
                const { offsetX, offsetY } = getCoordinates(e);
                ctx.beginPath();
                ctx.moveTo(offsetX, offsetY);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const { offsetX, offsetY } = getCoordinates(e);
                ctx.lineTo(offsetX, offsetY);
                ctx.stroke();
            };

            const stopDrawing = () => {
                ctx.closePath();
                setIsDrawing(false);
            };

            const getCoordinates = (event) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                if (event.touches && event.touches.length > 0) {
                    return { offsetX: event.touches[0].clientX - rect.left, offsetY: event.touches[0].clientY - rect.top };
                }
                return { offsetX: event.nativeEvent.offsetX, offsetY: event.nativeEvent.offsetY };
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            const handlePracticeInputChange = (colId, val) => {
                // On accepte seulement 1 seul chiffre pour forcer le bon placement manuel
                let cleanedVal = val.replace(/[^0-9]/g, ''); 
                if (cleanedVal.length > 1) cleanedVal = cleanedVal.slice(-1); 
                setPracticeInputs({ ...practiceInputs, [colId]: cleanedVal });
            };

            // Calcule où les chiffres doivent être placés AVANT l'ajout de zéros ou virgules
            const getExpectedInitial = () => {
                const expected = {km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''};
                
                // Gérer les nombres à virgule (ex: "8,8" ou "8.8")
                let cleanVal = baseVal.toString().replace(',', '.');
                let parts = cleanVal.split('.');
                let intPart = parts[0] || '0'; // ex: "8"
                let decPart = parts[1] || '';  // ex: "8"
                
                let currentIdx = cols.indexOf(baseUnit);
                
                // Placer la partie entière (de droite à gauche en partant de l'unité de base)
                for(let i = intPart.length - 1; i >= 0; i--) {
                    if(currentIdx >= 0) {
                        expected[cols[currentIdx]] = intPart[i];
                        currentIdx--;
                    }
                }
                
                // Placer la partie décimale (de gauche à droite en partant de la case d'après)
                currentIdx = cols.indexOf(baseUnit) + 1;
                for(let i = 0; i < decPart.length; i++) {
                    if(currentIdx < cols.length) {
                        expected[cols[currentIdx]] = decPart[i];
                        currentIdx++;
                    }
                }
                return expected;
            };

            const startPractice = () => {
                if(!baseVal) return;
                setPracticeInputs({km:'', hm:'', dam:'', m:'', dm:'', cm:'', mm:''});
                setPracticeMode('place');
                
                // Message dynamique selon s'il y a une virgule ou non
                let cleanVal = baseVal.toString().replace(',', '.');
                let parts = cleanVal.split('.');
                let hasDecimal = parts.length > 1 && parts[1].length > 0;
                
                let infoText = `Étape 1 : Place le nombre ${baseVal} dans le tableau. (Rappel: le chiffre des unités va dans ${baseUnit})`;
                if (hasDecimal) {
                    infoText = `Étape 1 : Place le nombre ${baseVal} dans le tableau. (Rappel: le chiffre juste AVANT la virgule (${parts[0].slice(-1)}) va dans ${baseUnit})`;
                }
                setPracticeFeedback({type: 'info', text: infoText});
            };

            const checkPlacement = () => {
                const expected = getExpectedInitial();
                let isCorrect = true;
                for (let col of cols) {
                    if ((practiceInputs[col] || '') !== (expected[col] || '')) {
                        isCorrect = false;
                        break;
                    }
                }
                if (isCorrect) {
                    setPracticeFeedback({ type: 'success', text: "Parfait ! Ton placement est bon. Clique sur 'Suivant' pour que la conversion se fasse." });
                    setPracticeMode('convert');
                } else {
                    let cleanVal = baseVal.toString().replace(',', '.');
                    let parts = cleanVal.split('.');
                    let hasDecimal = parts.length > 1 && parts[1].length > 0;
                    
                    let errorMsg = `Oups ! N'oublie pas : le chiffre des unités (${parts[0].slice(-1)}) va dans la colonne des ${baseUnit}, et un seul chiffre par case !`;
                    if (hasDecimal) {
                        errorMsg = `Oups ! Le chiffre juste avant la virgule (${parts[0].slice(-1)}) va dans la colonne des ${baseUnit}. Les autres chiffres suivent un par case !`;
                    }
                    setPracticeFeedback({ type: 'error', text: errorMsg });
                }
            };

            const executeConversion = () => {
                const expected = getExpectedInitial();
                let tIdx = cols.indexOf(targetUnit);
                let autoConverted = { ...expected };
                
                // 1. Trouver les bornes du nombre actuel (de quelle colonne à quelle colonne il s'étend)
                let leftMost = cols.length - 1;
                let rightMost = 0;
                cols.forEach((c, idx) => {
                    if (expected[c] !== '') {
                        if (idx < leftMost) leftMost = idx;
                        if (idx > rightMost) rightMost = idx;
                    }
                });
                
                // 2. Étendre les bornes pour inclure l'unité d'arrivée (targetUnit)
                let finalLeftMost = Math.min(leftMost, tIdx);
                let finalRightMost = Math.max(rightMost, tIdx);
                
                // 3. Ajouter les zéros (0) dans toutes les cases vides entre ces bornes
                for (let i = finalLeftMost; i <= finalRightMost; i++) {
                    if (!autoConverted[cols[i]]) {
                        autoConverted[cols[i]] = '0';
                    }
                }
                
                // 4. Déterminer s'il faut placer une virgule dans la colonne cible
                // Règle : S'il y a des chiffres à DROITE de l'unité cible, il faut une virgule.
                let needsComma = false;
                for (let i = tIdx + 1; i < cols.length; i++) {
                    if (autoConverted[cols[i]] && autoConverted[cols[i]] !== '') {
                        needsComma = true;
                        break;
                    }
                }
                
                if (needsComma) {
                    autoConverted[cols[tIdx]] += ',';
                }

                setPracticeInputs(autoConverted);
                setPracticeFeedback({ type: 'success', text: `Tada ! La virgule et les zéros se sont placés automatiquement pour créer des ${targetUnit}. ✨` });
                setPracticeMode('done');
            };

            const resetPractice = () => {
                setPracticeMode('setup');
                setPracticeFeedback(null);
            };

            return (
                <div className="flex flex-col gap-8 w-full animate-fade-in max-w-6xl mx-auto">
                    
                    {/* Consignes & Exploration */}
                    <div className="bg-white p-6 rounded-2xl shadow-lg w-full border-4 border-teal-200 text-center">
                        <h2 className="text-3xl font-bold text-teal-600 mb-4 flex justify-center items-center">
                            <span className="text-4xl mr-2">🕵️‍♂️</span> Mission d'Exploration & Pratique
                        </h2>
                        <p className="text-xl text-gray-700 mb-4">
                            Prends ta règle, trouve des objets dans la classe, mesure-les et pratique-toi à les convertir ci-dessous !
                        </p>
                    </div>

                    {/* Outils Interactifs - EMPILÉS POUR PLUS D'ESPACE */}
                    <div className="flex flex-col gap-10 w-full">
                        
                        {/* Simulateur de mesure (Règle GÉANTE) */}
                        <div className="bg-yellow-50 p-6 rounded-2xl shadow-lg border-4 border-yellow-300 flex flex-col w-full">
                            <h3 className="text-2xl font-bold text-yellow-700 mb-4">Simulateur de règle (Pleine largeur) 📏</h3>
                            <label className="text-gray-700 font-bold mb-2 text-xl">Glisse pour ajuster la longueur de l'objet ({sandboxLength.toFixed(1)} cm) :</label>
                            <input 
                                type="range" min="1" max="15" step="0.1" 
                                value={sandboxLength} 
                                onChange={(e) => setSandboxLength(parseFloat(e.target.value))}
                                className="w-full mb-10 h-6 bg-gray-300 rounded-lg appearance-none cursor-pointer shadow-inner"
                            />
                            
                            <div className="relative w-full mb-10 pt-4 mt-6">
                                {/* Ligne guide rouge */}
                                <div className="absolute top-[-5px] h-[160px] w-0 border-l-[4px] border-dashed border-red-500 z-0" 
                                     style={{ left: `${(sandboxLength / 15) * 100}%`, transform: 'translateX(-50%)' }}>
                                </div>
                                {/* Objet (Bloc vert) */}
                                <div className="relative z-10 flex items-center mb-2 h-24 drop-shadow-md" style={{ width: `${(sandboxLength / 15) * 100}%` }}>
                                    <div className="bg-green-400 h-full w-full rounded-md border-[4px] border-green-600"></div>
                                </div>
                                
                                {/* La règle de précision (15 cm) GÉANTE ET AÉRÉE */}
                                <div className="w-full h-32 bg-blue-50 relative flex shadow-lg border-y-[4px] border-black mt-4 rounded-b-lg">
                                    <div className="absolute left-0 top-0 bottom-0 border-l-[4px] border-black z-10"></div>
                                    {[...Array(15)].map((_, cmIndex) => (
                                        <div key={cmIndex} className="flex-1 relative h-full flex items-start border-r-[4px] border-black box-border">
                                            {/* Numéro avec plus de padding */}
                                            <span className="absolute bottom-2 left-0 transform -translate-x-1/2 font-black text-3xl md:text-5xl text-black bg-blue-50 px-2 rounded-full z-10">{cmIndex}</span>
                                            
                                            <div className="w-full h-full flex">
                                                {[...Array(10)].map((_, mmIndex) => (
                                                    <div key={mmIndex} className="flex-1 border-black box-border" style={{ 
                                                        height: mmIndex === 9 ? '0' : (mmIndex === 4 ? '50px' : '25px'), 
                                                        borderRightWidth: mmIndex === 9 ? '0' : '2px' 
                                                    }}></div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <span className="absolute bottom-2 right-0 transform translate-x-1/2 font-black text-3xl md:text-5xl text-black bg-blue-50 px-2 rounded-full z-10">15</span>
                                </div>
                            </div>
                        </div>

                        {/* Tableau Assisté pas à pas */}
                        <div className="bg-orange-50 p-6 rounded-2xl shadow-lg border-4 border-orange-300 flex flex-col w-full">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-2xl font-bold text-orange-800">Convertisseur Assisté 🤖</h3>
                                <button onClick={resetPractice} className="bg-orange-200 hover:bg-orange-300 text-orange-800 font-bold py-2 px-6 rounded-lg shadow text-xl">Recommencer</button>
                            </div>
                            
                            {/* Étape Setup */}
                            {practiceMode === 'setup' ? (
                                <div className="flex flex-col items-center bg-white p-6 rounded-xl shadow-inner border-2 border-orange-200 mb-4 space-y-6 w-full max-w-3xl mx-auto">
                                    <p className="text-gray-600 font-bold text-2xl">1. Choisis ta conversion :</p>
                                    <div className="flex items-center justify-center flex-wrap gap-4 text-2xl font-bold w-full">
                                        <input type="text" value={baseVal} onChange={e => setBaseVal(e.target.value.replace(/[^0-9.,]/g, ''))} placeholder="ex: 8,8" className="w-32 p-3 border-4 border-orange-400 rounded-xl text-center bg-gray-50 focus:bg-white" />
                                        <select value={baseUnit} onChange={e => setBaseUnit(e.target.value)} className="p-3 border-4 border-orange-400 rounded-xl bg-orange-100 cursor-pointer">
                                            {cols.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <span className="mx-4 text-3xl text-gray-500">➡️ vers ➡️</span>
                                        <select value={targetUnit} onChange={e => setTargetUnit(e.target.value)} className="p-3 border-4 border-purple-400 rounded-xl bg-purple-100 cursor-pointer">
                                            {cols.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={startPractice} className="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition text-2xl w-full max-w-md mt-4">
                                        C'est parti !
                                    </button>
                                </div>
                            ) : (
                                <div className="mb-6 text-center">
                                    <span className="text-3xl font-black bg-white px-8 py-3 rounded-xl shadow border-4 border-orange-300 inline-block text-orange-900">
                                        {baseVal} {baseUnit} ➡️ {targetUnit}
                                    </span>
                                </div>
                            )}

                            {/* Le Tableau */}
                            <div className="w-full overflow-x-auto pb-4">
                                <table className="w-full text-center border-collapse text-xl bg-white shadow-sm">
                                    <thead>
                                        <tr className="bg-orange-400 text-white">
                                            {cols.map(col => <th key={col} className="border-4 border-orange-500 py-3 w-[14%] text-2xl">{col}</th>)}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            {cols.map(col => (
                                                <td key={col} className={`border-4 border-orange-500 p-2 h-28 relative ${practiceMode === 'done' && targetUnit === col ? 'bg-purple-100' : ''}`}>
                                                    <input
                                                        type="text"
                                                        value={practiceInputs[col]}
                                                        onChange={(e) => handlePracticeInputChange(col, e.target.value)}
                                                        disabled={practiceMode !== 'place'}
                                                        className="w-full h-full text-center text-5xl font-black focus:outline-none focus:bg-orange-100 rounded text-gray-800 bg-transparent disabled:opacity-100 disabled:bg-transparent"
                                                    />
                                                </td>
                                            ))}
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            {/* Feedbacks et Boutons */}
                            {practiceFeedback && (
                                <div className={`mt-6 p-6 rounded-xl text-2xl font-bold text-center ${practiceFeedback.type === 'success' ? 'bg-green-100 text-green-700 border-4 border-green-400' : practiceFeedback.type === 'error' ? 'bg-red-100 text-red-700 border-4 border-red-400' : 'bg-blue-100 text-blue-800 border-4 border-blue-400'}`}>
                                    {practiceFeedback.text}
                                </div>
                            )}

                            <div className="mt-8 flex justify-center">
                                {practiceMode === 'place' && (
                                    <button onClick={checkPlacement} className="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-10 rounded-xl shadow-lg transition text-2xl transform hover:scale-105">
                                        Vérifier mon placement
                                    </button>
                                )}
                                {practiceMode === 'convert' && (
                                    <button onClick={executeConversion} className="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 px-10 rounded-xl shadow-lg transition text-2xl flex items-center space-x-3 transform hover:scale-105 animate-pulse">
                                        <span>Compléter le placement (zéros et virgule)</span> <span className="text-3xl">🪄</span>
                                    </button>
                                )}
                            </div>
                        </div>

                    </div>

                    {/* Tableau de la classe pour écrire */}
                    <div className="bg-teal-50 p-6 rounded-2xl shadow-lg w-full flex flex-col border-4 border-teal-300 mt-4">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-2xl font-bold text-teal-800">Tableau de la classe ✍️</h3>
                            <button onClick={clearCanvas} className="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg shadow transition">
                                Effacer
                            </button>
                        </div>
                        <p className="text-gray-600 mb-4 italic">Utilise ton doigt ou la souris pour écrire tes notes, tes mesures et tes dessins ici.</p>
                        
                        <div className="flex-grow w-full rounded-xl bg-white border-2 border-gray-300 shadow-inner overflow-hidden" style={{ minHeight: '350px' }}>
                            <canvas 
                                ref={canvasRef}
                                className="w-full h-full cursor-crosshair"
                                onMouseDown={startDrawing}
                                onMouseMove={draw}
                                onMouseUp={stopDrawing}
                                onMouseLeave={stopDrawing}
                                onTouchStart={startDrawing}
                                onTouchMove={draw}
                                onTouchEnd={stopDrawing}
                            ></canvas>
                        </div>
                    </div>

                </div>
            );
        };

        // --- COMPOSANT PRINCIPAL: APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState(1);

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col items-center">
                    
                    {/* En-tête */}
                    <header className="mb-10 text-center">
                        <h1 className="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-500 via-purple-500 to-teal-500 drop-shadow-sm mb-4">
                            Super Détectives des Mesures !
                        </h1>
                        <p className="text-2xl text-gray-600 font-bold">Mathématiques - 2e Cycle</p>
                    </header>

                    {/* Menu des onglets */}
                    <div className="flex flex-wrap justify-center gap-4 mb-8 w-full max-w-6xl">
                        <button 
                            onClick={() => setActiveTab(1)}
                            className={`flex-1 min-w-[200px] py-4 px-6 rounded-2xl text-xl font-bold transition-all duration-300 flex items-center justify-center space-x-2 ${activeTab === 1 ? 'tab-button-active bg-blue-500' : 'tab-button-inactive bg-blue-100 hover:bg-blue-200'}`}
                        >
                            <span>📏</span> <span>La règle</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab(2)}
                            className={`flex-1 min-w-[200px] py-4 px-6 rounded-2xl text-xl font-bold transition-all duration-300 flex items-center justify-center space-x-2 ${activeTab === 2 ? 'tab-button-active bg-purple-500' : 'tab-button-inactive bg-purple-100 hover:bg-purple-200'}`}
                        >
                            <span>🌎</span> <span>Système métrique</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab(4)}
                            className={`flex-1 min-w-[200px] py-4 px-6 rounded-2xl text-xl font-bold transition-all duration-300 flex items-center justify-center space-x-2 ${activeTab === 4 ? 'tab-button-active bg-orange-500' : 'tab-button-inactive bg-orange-100 hover:bg-orange-200'}`}
                        >
                            <span>📊</span> <span>Tableau</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab(3)}
                            className={`flex-1 min-w-[200px] py-4 px-6 rounded-2xl text-xl font-bold transition-all duration-300 flex items-center justify-center space-x-2 ${activeTab === 3 ? 'tab-button-active bg-teal-500' : 'tab-button-inactive bg-teal-100 hover:bg-teal-200'}`}
                        >
                            <span>✍️</span> <span>Pratique</span>
                        </button>
                    </div>

                    {/* Contenu des onglets */}
                    <div className="w-full max-w-6xl flex-grow flex justify-center pb-10">
                        {activeTab === 1 && <TabRuler />}
                        {activeTab === 2 && <TabMetric />}
                        {activeTab === 4 && <TabTableau />}
                        {activeTab === 3 && <TabPractice />}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
